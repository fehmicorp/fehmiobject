name: Build and Publish Versioned Images

on:
  push:
    branches: [ "main", "build" ]
  workflow_dispatch:
    inputs:
      target_version:
        description: 'Target version directory to build (e.g., v1 or v2)'
        required: true
        default: 'v1'

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Version Variables
        id: vars
        run: |
          # Use manual workflow input if provided, otherwise default to v1
          VERSION="${{ github.event.inputs.target_version || 'v1' }}"
          SHORT_DATE=$(date +%Y%m%d)
          
          # Read version suffix or tag dynamically from the target folder's go.mod or fallback
          TAG_NAME="fehmiobject_${VERSION}_${SHORT_DATE}:1.0.0"
          
          echo "target_version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION with tag: $TAG_NAME"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            VERSION=${{ steps.vars.outputs.target_version }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}:${{ steps.vars.outputs.tag_name }}
            ${{ env.REGISTRY }}/${{ github.repository }}:${{ steps.vars.outputs.target_version }}-latest
